name: CI

# 不依赖任何真实 API Key：所有测试使用 fixture / mock，
# 未配置 Key 的分支走「未配置」路径，同样可断言。
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: 密钥泄漏扫描（VITE_*KEY / 硬编码 Key）
        run: node scripts/scan-secrets.mjs
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 单元测试
        run: npx vitest run
      - name: 构建
        run: npm run build
