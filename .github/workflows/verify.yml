# CI：与本地 `npm run verify` 同一套关卡，避免"本地过了线上炸"
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 顺序与本地 verify 一致：先拦密钥泄漏，再类型/规范/测试/构建
      - run: npm run scan:secrets
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:cycles
      - run: npm run test
      - run: npm run build
        env:
          # 构建元数据：UI 的 build tooltip 会显示它，便于确认线上跑的是哪一版
          BUILD_SHA: ${{ github.sha }}

  e2e:
    # 浏览器级冒烟：所有外部依赖用 page.route 打桩，不需要真实 Key。
    # 与 verify 分开跑：它更慢，且失败原因通常是 UI 层的
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
