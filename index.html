<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>硬件原型工坊 · Tindie Proto</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
</head>
<body>
  <div id="root"></div>
  <script>
    // 在 React 挂载前按已保存的语言定标题，避免刷新瞬间先显示中文再切英文
    (function () {
      try {
        var l = localStorage.getItem('cc_lang');
        document.documentElement.lang = l === 'en' ? 'en' : 'zh-CN';
        document.title = l === 'en' ? 'Hardware Prototype Workshop · Tindie Proto' : '硬件原型工坊 · Tindie Proto';
      } catch (e) { /* 隐私模式下 localStorage 不可用，用默认标题 */ }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
